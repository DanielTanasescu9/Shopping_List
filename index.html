<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison — Liste de Courses</title>

<meta name="description" content="A luxurious glass-morphism shopping list. Beautiful, simple, saved to your browser.">
<meta name="author" content="Daniel Tanasescu">
<meta name="theme-color" content="#0a0a0a">

  <!-- favicon (inline SVG — no file needed) -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

  <!-- open graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Maison — Shopping List">
<meta property="og:description" content="A luxurious glass-morphism shopping list. Beautiful, simple, saved to your browser.">
<meta property="og:image" content="https://maisonlist.netlify.app/background.jpg">
<meta property="og:url" content="https://maisonlist.netlify.app/">

  <!-- twitter card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Maison — Shopping List">
<meta name="twitter:description" content="A luxurious glass-morphism shopping list.">
<meta name="twitter:image" content="https://maisonlist.netlify.app/background.jpg">

   <!-- fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Caveat:wght@400;500&display=swap" rel="stylesheet">

  <!-- styles -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="glass" aria-label="Shopping list">
  <span class="glass-border"></span>
  <span class="glass-corner tl"></span>
  <span class="glass-corner tr"></span>
  <span class="glass-bottom-glow"></span>

  <header class="header">
    <p class="eyebrow">Maison de Courses</p>
    <h1 class="title">Shopping List</h1>
    <div class="rule"><span class="diamond"></span></div>
    <p class="subtitle">Curated selections, kept with care.</p>
  </header>

  <section class="paper">

    <p class="paper-label">~ today's list ~</p>
    <h2 class="paper-title">Sunday Market</h2>
    <p class="paper-date" id="date"></p>

    <div class="field">
      <input id="input" type="text" placeholder="write an item…" autocomplete="off" spellcheck="false">
      <button id="add" class="add">Add</button>
    </div>

    <ul id="list" class="list"></ul>

    <footer class="footer">
      <span id="counter">0 items</span>
      <button id="clear" class="clear">Clear all</button>
    </footer>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
